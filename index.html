<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>學霸美食轉盤</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 左側抽屜式選單 -->
  <div id="drawer" class="drawer">
    <div class="drawer-header">
      <h2>🍽️ 轉盤選項</h2>
      <button id="closeDrawer" class="close-btn">&times;</button>
    </div>
    
    <div class="input-group">
      <input type="text" id="newItemInput" placeholder="輸入想吃的食物...">
      <button id="addItemBtn">新增</button>
    </div>
    
    <ul id="itemList" class="item-list"></ul>
  </div>

  <!-- 背景遮罩 -->
  <div id="overlay" class="overlay"></div>

  <!-- 主畫面 -->
  <div class="main-content">
    <div class="header">
      <button id="openDrawer" class="menu-btn">☰ 選項設定</button>
    </div>

    <div class="wheel-wrapper">
      <div class="pointer">▼</div>
      <!-- 高解析度 Canvas 轉盤 -->
      <canvas id="wheelCanvas"></canvas>
    </div>

    <button id="spinBtn" class="spin-btn">GO！開始抽</button>
  </div>

  <!-- 中獎結果彈窗 -->
  <div id="resultModal" class="modal">
    <div class="modal-content">
      <h2>🎉 抽中啦！</h2>
      <p id="resultText" class="result-text">今天吃：</p>
      
      <!-- 垂直排列的按鈕區 -->
      <div class="modal-buttons">
        <button id="searchBtn" class="modal-btn btn-primary">🔍 搜尋店家</button>
        <button id="spinAgainBtn" class="modal-btn btn-secondary">🔄 再轉一次</button>
        <button id="returnBtn" class="modal-btn btn-outline">⬅️ 返回</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
