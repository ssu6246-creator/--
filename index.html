<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>美食幸運轉盤</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 側邊欄 (Sidebar UI) -->
  <div id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <h2>🍽️ 轉盤選項</h2>
      <button id="closeSidebar" class="close-btn">&times;</button>
    </div>
    
    <div class="input-group">
      <input type="text" id="newItemInput" placeholder="輸入想吃的食物...">
      <button id="addItemBtn">新增</button>
    </div>
    
    <ul id="itemList" class="item-list">
      <!-- 選項會透過 JS 動態生成在這裡 -->
    </ul>
  </div>

  <!-- 背景遮罩 -->
  <div id="overlay" class="overlay"></div>

  <!-- 主畫面 -->
  <div class="main-content">
    <div class="header">
      <button id="openSidebar" class="menu-btn">☰ 選項設定</button>
    </div>

    <div class="wheel-wrapper">
      <div class="pointer">▼</div>
      <!-- HTML5 Canvas 轉盤 -->
      <canvas id="wheelCanvas" width="320" height="320"></canvas>
    </div>

    <button id="spinBtn" class="spin-btn">GO！開始抽</button>
    
    <div id="resultText" class="result-text">今天吃什麼？</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
