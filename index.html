<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸運大轉盤</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 左上角選單按鈕 (開啟側欄) -->
    <button id="menuToggle" class="menu-toggle" title="設定獎項">
        <svg viewBox="0 0 24 24">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
    </button>

    <!-- 背景遮罩 -->
    <div id="sidebarOverlay" class="sidebar-overlay closed"></div>

    <!-- 左側邊欄 -->
    <aside id="sidebar" class="sidebar closed">
        <div class="sidebar-header">
            <h2>獎項設定</h2>
            <button id="closeSidebar">&times;</button>
        </div>
        
        <div class="sidebar-body">
            <!-- 預設快捷標籤區塊 -->
            <div class="preset-section">
                <div class="preset-header">快捷選項 (點擊選取)</div>
                <div id="presetTags" class="preset-tags"></div>
            </div>

            <hr class="divider">

            <!-- 自訂獎項列表區塊 -->
            <div class="preset-header">獎項列表</div>
            <div id="prizeList"></div>
            <button id="addPrizeBtn" class="action-btn">+ 新增獎項</button>
            <button id="saveBtn" class="action-btn save">更新轉盤</button>
        </div>
    </aside>

    <div class="main-container">
        <div class="container">
            <h1>幸運大轉盤</h1>
            
            <div class="wheel-container">
                <div class="pointer"></div>
                <canvas id="wheelCanvas" width="300" height="300"></canvas>
            </div>

            <button id="spinBtn">開始抽獎</button>
        </div>
    </div>

    <!-- 中獎結果 -->
    <div id="resultModal" class="modal hidden">
        <div class="modal-content">
            <h2>恭喜獲得！</h2>
            <p id="resultText">獎項</p>
            <button id="closeModal">確定</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
